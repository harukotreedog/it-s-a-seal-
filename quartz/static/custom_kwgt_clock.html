<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>自定义时钟</title>
  <style>
    :root {
      --bg: #101114;
      --fg: #f3f3f3;
      --muted: #9b9ca3;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { text-align: center; }
    #clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(4rem, 20vw, 12rem);
      font-weight: 300;
      letter-spacing: -0.055em;
      line-height: 1;
    }
    #real-time {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }
    #note {
      margin-top: 0.8rem;
      color: var(--muted);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <main>
    <div id="clock" aria-live="off">--:--</div>
    <div id="real-time"></div>
    <div id="note">自定义时间制 · 页面打开时自动更新</div>
  </main>
  <script>
    "use strict";

    // 对应原 KWGT 公式：
    // t = (小时 * 60 + 分钟 - 320 + 1440) % 1440
    // h = t < 1200 ? floor(t / 200) : (t < 1240 ? 6 : 7)
    // mm = t < 1200 ? t % 200 : (t < 1240 ? t - 1200 : t - 1240)
    function customTime(date = new Date()) {
      const t = (date.getHours() * 60 + date.getMinutes() - 320 + 1440) % 1440;
      const h = t < 1200
        ? Math.floor(t / 200)
        : (t < 1240 ? 6 : 7);
      const mm = t < 1200
        ? t % 200
        : (t < 1240 ? t - 1200 : t - 1240);

      return `${String(h).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = customTime(now);
      document.getElementById("real-time").textContent =
        `当地时间 ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) updateClock();
    });
  </script>
</body>
</html>
